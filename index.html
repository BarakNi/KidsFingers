<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Geffen & Gur's Game 🎮</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body tabindex="0">
  <div id="bg-overlay"></div>
  <div id="lift-prompt">☝️ Lift your finger!<br>Then press again!</div>

  <div class="top-bar">
    <button class="mode-btn active" id="btn-geffen" aria-label="Switch to Geffen mode">🌟 Geffen</button>
    <button class="mode-btn" id="btn-gur" aria-label="Switch to Gur mode">📚 Gur</button>
    <button id="dark-toggle" aria-label="Toggle dark mode">🌙</button>
  </div>

  <div id="geffen-section">
    <div style="text-align:center">
      <h1>🌟 Geffen's Game 🌟</h1>
      <p class="subtitle">Press a key — then lift your finger!</p>
      <div id="emoji-display">🎈</div>
      <div id="word-display"></div>
      <div id="letter-display">?</div>
    </div>
  </div>

  <div id="gur-section">
    <div style="text-align:center">
      <h1>📚 Gur's Game 📚</h1>
      <p class="subtitle">Type the word you see!</p>
      <div id="gur-emoji" style="font-size:clamp(4rem,14vw,7rem);min-height:80px;">🍎</div>
      <div id="target-word">A P P L E</div>
      <div id="typed-word"></div>
      <div id="word-hint">This is a fruit! 🍎</div>
      <div id="score-display">🔥 Streak: 0</div>
    </div>
  </div>

  <div id="celebration"></div>

  <!-- Config first (data), then modules, then main (init) -->
  <script src="js/config.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/effects.js"></script>
  <script src="js/geffen.js"></script>
  <script src="js/gur.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
